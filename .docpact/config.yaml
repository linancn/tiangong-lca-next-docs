version: 1
layout: repo
lastReviewedAt: "2026-07-01"
lastReviewedCommit: "b52261c56f0bf6c7455a5f16c667c317c2b8966e"

catalog:
  repos:
    - id: next-docs
      path: .
      canonicalRepo: linancn/tiangong-lca-next-docs
      entryDoc: AGENTS.md
      workflowDocs:
        - docs/agents/repo-validation.md
        - docs/agents/repo-architecture.md
      workspaceIntegrationRequired: true

ownership:
  domains:
    - id: repo-governance-and-docs
      paths:
        include:
          - AGENTS.md
          - README.md
          - TODO.docs-system-gaps.md
          - .docpact/config.yaml
          - docs/agents/**
          - .github/workflows/ai-doc-lint.yml
          - .github/workflows/publish-docs.yml
      ownerRepo: next-docs
    - id: public-doc-content
      paths:
        include:
          - docs/**
          - i18n/en/docusaurus-plugin-content-docs/current/**
          - static/**
      ownerRepo: next-docs
    - id: docs-site-structure
      paths:
        include:
          - sidebars.ts
          - docusaurus.config.ts
          - src/**
          - package.json
          - tsconfig.json
          - context7.json
          - scripts/generate-llms-txt.mjs
          - scripts/check-publication-scope.mjs
          - scripts/publication-policy.mjs
      ownerRepo: next-docs

    - id: local-docpact-push-gate
      paths:
        include:
          - .githooks/**
          - scripts/docpact
          - scripts/docpact-gate.sh
          - scripts/install-git-hooks.sh
      ownerRepo: next-docs

coverage:
  include:
    - .githooks/**
    - scripts/docpact
    - scripts/docpact-gate.sh
    - scripts/install-git-hooks.sh
    - AGENTS.md
    - README.md
    - TODO.docs-system-gaps.md
    - .docpact/config.yaml
    - docs/agents/**
    - docs/**
    - i18n/en/docusaurus-plugin-content-docs/current/**
    - static/**
    - context7.json
    - scripts/generate-llms-txt.mjs
    - scripts/check-publication-scope.mjs
    - scripts/publication-policy.mjs
    - sidebars.ts
    - docusaurus.config.ts
    - src/**
    - package.json
    - tsconfig.json
    - .github/workflows/ai-doc-lint.yml
    - .github/workflows/publish-docs.yml
  exclude:
    - .git/**
    - .github/scripts/**
    - .docpact/runs/**
    - node_modules/**
    - build/**
    - .docusaurus/**

freshness:
  warn_after_commits: 40
  warn_after_days: 60
  critical_after_days: 120

routing:
  intents:
    local-docpact-gate:
      paths:
        - .githooks/pre-push
        - scripts/docpact
        - scripts/docpact-gate.sh
        - scripts/install-git-hooks.sh
    public-content:
      paths:
        - docs/**
        - i18n/en/docusaurus-plugin-content-docs/current/**
        - static/**
    site-structure:
      paths:
        - sidebars.ts
        - docusaurus.config.ts
        - src/**
        - package.json
        - tsconfig.json
        - context7.json
        - scripts/generate-llms-txt.mjs
        - scripts/check-publication-scope.mjs
        - scripts/publication-policy.mjs
        - .github/workflows/publish-docs.yml
    drift-backlog:
      paths:
        - TODO.docs-system-gaps.md
    repo-docs:
      paths:
        - AGENTS.md
        - README.md
        - .docpact/config.yaml
        - docs/agents/**
        - .github/workflows/ai-doc-lint.yml
    proof:
      paths:
        - docs/agents/repo-validation.md
        - package.json
        - sidebars.ts
        - docusaurus.config.ts
        - src/**
    root-integration:
      paths:
        - AGENTS.md

docInventory:
  include:
    - AGENTS.md
    - README.md
    - TODO.docs-system-gaps.md
    - .docpact/config.yaml
    - docs/agents/repo-validation.md
    - docs/agents/repo-architecture.md

repo:
  id: next-docs
  owner: next-docs

rules:
  - id: next-docs-bootstrap-contract
    scope: repo
    repo: next-docs
    triggers:
      - path: AGENTS.md
        kind: doc-contract
      - path: .docpact/config.yaml
        kind: doc-ai-layer
      - path: docs/agents/repo-validation.md
        kind: deep-doc
      - path: docs/agents/repo-architecture.md
        kind: deep-doc
      - path: ai/**
        kind: legacy-doc-ai-layer
      - path: .github/scripts/ai-doc-lint.mjs
        kind: legacy-automation
      - path: .github/scripts/ai-doc-lint.test.mjs
        kind: legacy-automation
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
      - path: docs/agents/repo-architecture.md
        mode: review_or_update
    reason: Repo entry guidance, machine-readable routing, retained source docs, and legacy AI-doc removal must stay aligned.
  - id: next-docs-readme-and-backlog-contract
    scope: repo
    repo: next-docs
    triggers:
      - path: README.md
        kind: repo-landing
      - path: TODO.docs-system-gaps.md
        kind: docs-backlog
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: README.md
        mode: review_or_update
      - path: TODO.docs-system-gaps.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
    reason: Maintainer workflow and durable docs-drift backlog must stay aligned with the repo contract.
  - id: next-docs-public-content-contract
    scope: repo
    repo: next-docs
    triggers:
      - path: docs/**
        kind: public-doc-source
      - path: i18n/en/docusaurus-plugin-content-docs/current/**
        kind: public-doc-mirror
      - path: static/**
        kind: public-asset
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/agents/repo-architecture.md
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
    reason: Public pages, mirrors, and assets define what this repo publishes and must keep ownership and proof expectations aligned.
  - id: next-docs-site-structure-contract
    scope: repo
    repo: next-docs
    triggers:
      - path: sidebars.ts
        kind: site-nav
      - path: docusaurus.config.ts
        kind: site-config
      - path: src/**
        kind: site-runtime
      - path: package.json
        kind: site-runtime-config
      - path: tsconfig.json
        kind: site-runtime-config
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
      - path: docs/agents/repo-architecture.md
        mode: review_or_update
    reason: Navigation, site config, and runtime wiring change how future docs work should be routed and checked.
  - id: next-docs-doc-governance-ci
    scope: repo
    repo: next-docs
    triggers:
      - path: .github/workflows/ai-doc-lint.yml
        kind: automation
      - path: .github/workflows/publish-docs.yml
        kind: automation
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
    reason: Documentation governance automation changes alter the maintenance gate and proof expectations.
  - id: next-docs-publication-pipeline
    scope: repo
    repo: next-docs
    triggers:
      - path: .github/workflows/publish-docs.yml
        kind: publication-automation
      - path: context7.json
        kind: ai-publication-config
      - path: static/llms.txt
        kind: ai-publication-index
      - path: scripts/generate-llms-txt.mjs
        kind: publication-automation
      - path: scripts/check-publication-scope.mjs
        kind: publication-automation
      - path: scripts/publication-policy.mjs
        kind: publication-automation
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: README.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
      - path: docs/dev/dev-env.md
        mode: review_or_update
      - path: i18n/en/docusaurus-plugin-content-docs/current/dev/dev-env.md
        mode: review_or_update
    reason: The publish workflow, llms.txt generator, publication scope policy, and Context7 source config define what public docs are exposed after main merges.
  - id: next-docs-local-docpact-push-gate
    scope: repo
    repo: next-docs
    triggers:
      - path: .githooks/pre-push
        kind: local-git-hook
      - path: scripts/docpact
        kind: local-automation
      - path: scripts/docpact-gate.sh
        kind: local-automation
      - path: scripts/install-git-hooks.sh
        kind: local-automation
    requiredDocs:
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
    reason: Local push documentation governance gates must stay aligned with repo validation guidance and docpact configuration.
